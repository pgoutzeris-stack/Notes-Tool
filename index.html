<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Tool – ROOTS</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/circular-std" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="./css/notes.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="screen-login">
    <div class="login-card">
      <div class="logo-wrap">
        <img src="https://roots-consultants.de/wp-content/uploads/2025/04/Roots-Brand-Strategy-Consultants-Logo.svg" alt="ROOTS" />
      </div>
      <h1 class="card-title">Notes Tool</h1>
      <p class="card-sub">Visualisiere Ideen, organisiere Notizen und exportiere in viele Formate.</p>
      <div class="alert" id="login-error"><span id="login-error-text"></span></div>
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">E-Mail</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" id="login-email" required autocomplete="username" />
          </div>
        </div>
        <div class="form-group">
          <label for="login-password">Passwort</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="login-password" required autocomplete="current-password" />
          </div>
        </div>
        <button type="submit" class="btn-primary btn-primary--block" id="btn-login">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Anmelden
        </button>
      </form>
    </div>
  </section>

  <main id="screen-dashboard"></main>
  <div id="screen-editor"></div>
  <div id="screen-loading" aria-live="polite">
    <i class="fa-solid fa-circle-notch fa-spin"></i>
    <span>Notes Tool wird geladen…</span>
  </div>
  <div id="screen-auth-hint" class="iframe-auth-hint" hidden>
    <i class="fa-solid fa-lock"></i>
    <strong>Anmeldung erforderlich</strong>
    <p>Bitte melde dich im ROOTS Intranet an und öffne das Notes Tool erneut.</p>
  </div>
  <div id="toast-container" aria-live="polite"></div>

<script>
window.RootsUser = window.RootsUser || {
  _p: null, _sb: null, _uid: null,
  _initials(n) {
    if (!n) return '?';
    return n.trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
  },
  async _loadAndMount(sb) {
    this._sb = sb;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    this._uid = session.user.id;
    const { data } = await sb.schema('users').from('profiles')
      .select('id,email,full_name,position,avatar_url,app_role')
      .eq('id', this._uid).maybeSingle();
    this._p = data || { id: this._uid, email: session.user.email, app_role: 'reader' };
  },
  isAdmin() { return String(this._p?.app_role || '').trim() === 'admin'; },
};
try {
  if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
} catch {
  document.documentElement.classList.add('in-iframe');
}
</script>
<script src="https://pgoutzeris-stack.github.io/ROOTS_Intranet/roots-user-bridge.js"></script>

<script type="module">
import { SB_URL, SB_ANON } from './config.js';
import { initApp } from './js/app.js';

const { createClient } = window.supabase;
const sb = createClient(SB_URL, SB_ANON, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: window.localStorage },
});
window.__rootsSupabaseClient = sb;
const LOGIN_HTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Anmelden';

function resetLoginBtn() {
  const btn = document.getElementById('btn-login');
  if (btn) { btn.disabled = false; btn.innerHTML = LOGIN_HTML; }
}

function showLogin() {
  document.getElementById('screen-loading')?.classList.add('is-done');
  document.getElementById('screen-auth-hint')?.setAttribute('hidden', '');
  document.getElementById('screen-dashboard').style.display = 'none';
  document.getElementById('screen-editor').style.display = 'none';
  if (document.documentElement.classList.contains('in-iframe')) {
    document.getElementById('screen-auth-hint')?.removeAttribute('hidden');
    return;
  }
  document.getElementById('screen-login').style.display = 'flex';
  document.body.classList.remove('body-dashboard');
  resetLoginBtn();
}

async function onSession(session) {
  try {
    if (!session) {
      showLogin();
      if (window.RootsUser) { window.RootsUser._uid = null; window.RootsUser._p = null; }
      return;
    }
    await window.RootsUser._loadAndMount(sb);
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-auth-hint')?.setAttribute('hidden', '');
    document.body.classList.add('body-dashboard');
    initApp(sb);
  } catch (e) {
    console.error('Notes onSession', e);
    window.notesToast?.(e.message || 'Start fehlgeschlagen', 'error');
  } finally {
    document.getElementById('screen-loading')?.classList.add('is-done');
  }
}

window.addEventListener('message', (e) => {
  if (e.origin !== 'https://pgoutzeris-stack.github.io') return;
  if (e.data?.type === 'roots-notes-refresh') {
    void sb.auth.getSession().then(({ data: { session } }) => onSession(session));
  }
});

window.addEventListener('roots-auth-ready', (e) => {
  if (e.detail?.session) void onSession(e.detail.session);
});

const notesInIframe = document.documentElement.classList.contains('in-iframe');
if (!notesInIframe) {
  sb.auth.getSession().then(({ data: { session } }) => onSession(session));
}
sb.auth.onAuthStateChange((event, session) => {
  if (notesInIframe && (event === 'INITIAL_SESSION' || event === 'SIGNED_OUT')) return;
  if (event === 'SIGNED_OUT') { showLogin(); return; }
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
    if (session) void onSession(session);
  }
});

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('login-error');
  const errT = document.getElementById('login-error-text');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Anmelden…';
  err.classList.remove('visible');
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-password').value,
  });
  if (error) {
    errT.textContent = 'Ungültige E-Mail oder falsches Passwort.';
    err.classList.add('visible');
    resetLoginBtn();
  }
});
</script>
</body>
</html>
